<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVREPARASERNERD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div class="componente-banner-topo">
            <h1>MEGA WIKI NERD</h1>
        </div>
        <div class="componente-faixa-paleta">
            <div class="cor-1"></div>
            <div class="cor-2"></div>
            <div class="cor-3"></div>
        </div>
        <nav>
            <div class="componente-mapa-wiki">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="perfil.html">Meu Perfil</a></li>
                    <li><a href="avaliacoes.html">Avaliações</a></li>
                    <li><a href="personagens.html">Personagens </a></li>
                    <li><a href="login.html"id="btn-usuario">Login</a></li>
                </ul>
            </div>
            <input type="text" id="search" class="barra-pesquisa" placeholder="BUSCAR...">
        </nav>
    </header>

    <main class="componente-main">
        <div class="container">
            <div class="row g-3">
                <div class="componente-conteudo-serie" id="conteudo-serie">

                    <div class="componente-faixa-rosa"></div>
                    <div class="informacoes-serie">

                        <div class="div-imagem col-md-3 col-sm-12 col-12">
                            <img id="imagem" class="componente-imagem-detalhe" src="" alt="">
                        </div>

                        <div class="componente-dados-serie col-md-9 col-sm-12 col-12">
                            <div class="cabecalho-serie">
                                <h2 id="titulo"></h2>
                                <p id="tamanho"></p>
                            </div>
                            <div class="informacoes-extra">
                                <div id="carouselExampleIndicators" class="carousel slide">
                                <div class="carousel-indicators">
                                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                                </div>
                                <div class="carousel-inner">
                                    <div class="carousel-item active">
                                        <img id="carrossel-imagem-1" src="..." class="componente-imagem-carrossel-detalhe d-block w-100" alt="...">
                                    </div>
                                    <div class="carousel-item">
                                        <img id="carrossel-imagem-2" src="..." class="componente-imagem-carrossel-detalhe d-block w-100" alt="...">
                                    </div>
                                    <div class="carousel-item">
                                        <img id="carrossel-imagem-3" src="..." class="componente-imagem-carrossel-detalhe d-block w-100" alt="...">
                                    </div>
                                </div>
                                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Previous</span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Next</span>
                                </button>
                                </div>
                                <div class="botoes-informacoes">
                                    <div class="componente-faixa-rosa"></div>
                                    <button id="btn-assistido">
                                        <i id="icone-assistido" class="bi bi-eye"></i>
                                        ASSISTIDO
                                    </button>
                                    <button id="btn-favoritar">
                                        <i id="icone-favorito" class="bi bi-heart"></i>
                                        FAVORITAR
                                    </button>
                                    <button id="btn-minhalista">
                                        <i id="icone-lista" class="bi bi-bookmark"></i>
                                        ADICIONAR À LISTA   
                                    </button>
                                    <div class="div-avaliacao">
                                        <p id="avaliacao-obra"></p>
                                    </div>
                                </div>
                            </div>

                            <div class="caixa-de-dados">
                                <div class="gaveta-dados">
                                    <p id="streaming"></p>
                                </div>
                                <div class="gaveta-dados">
                                    </p> <p id="estreia"></p>
                                </div>
                                <div class="gaveta-dados">
                                    </p> <p id="generos"></p>
                                </div>

                            </div>
                            
                        </div>
                    </div>

                    <p id="sinopse"></p>

                </div>
                
            </div>

        <div class="opcoes-usuarios">
            <div class="avaliacao-usuario" id="avaliacao">
                <h2 class="componente-titulo-rosa">SUA AVALIAÇÃO:</h2>
                <div id="btn-avaliacao"></div>
                <div class="remove">
                    <button id="remover-avaliacao">REMOVER AVALIAÇÃO</button>
                </div>
            </div>
            <div class="calculadora" id="calculadora">
                <h2 class="componente-titulo-rosa">CALCULADORA DE TEMPO:</h2>
                <p id="tempo-total"></p>
                <label for="episodios-dia">Quantos episódios você assiste por dia?</label>
                
                <div class="calculadora-input">
                    <button id="btn-menos" class="btn-calculadora"><i class="bi bi-dash-lg"></i></button>
                    <input type="number" id="episodios-dia" value="1" min="1" class="select-dias">
                    <button id="btn-mais" class="btn-calculadora"><i class="bi bi-plus-lg"></i></button>
                </div>

                <div id="resultado-calculadora">
                    <p id="total-dias"></p>
                    <p id="tempo-por-episodio"></p>
                </div>
            </div>
        </div>

        <div class="componente-personagens-serie">
            <h2 class="componente-titulo-rosa">PERSONAGENS</h2>
            <div id="cards-personagens" class="row"></div>
        </div>

        <div id="elenco" class="componente-elenco-serie">
            <h2 class="componente-titulo-rosa">ELENCO</h2>
            <div id="cards-atores" class="row"></div>
        </div>

        <div id="componente-episodios-serie">
            <div class="componente-titulo-rosa" id="titulo-reparticoes"></div>
            <div id="episodios" class="row"></div>
        </div>

        <div id="componente-explore-serie">
            <h2 class="componente-titulo-rosa">EXPLORE MAIS:</h2>
            <div id="explore-mais" class="row explore-mais"></div>
        </div>

        </div>

    </main>
    <footer class="componente-rodape-geral">SIGA @LIVREPARASERNERD NO INSTAGRAM!</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/detalhes.js"></script>
    <script src="js/temas.js"></script>
</body>
</html>
