<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVREPARASERNERD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div class="componente-banner-topo">
            <h1>MEGA WIKI NERD</h1>
        </div>
        <div class="componente-faixa-paleta">
            <div class="cor-1"></div>
            <div class="cor-2"></div>
            <div class="cor-3"></div>
        </div>
    </header>
    <main class="tela-login">

        <div class="painel-login">
            <div class="componente-faixa-rosa"></div>
            <h1 class="texto-login">AQUI VOCÊ É LIVRE PARA SER NERD!</h1>
            <p class="texto-login">
                Faça login para acessar seus favoritos, avaliações e recursos exclusivos do MEGA WIKI NERD!.
            </p>

            <form id="form-login" class="formularios">
                <input type="text" id="login" placeholder="Usuário: ">
                <input type="text" id="senha" placeholder="Senha: ">
                <button type="submit">Entrar</button>
            </form>

            <form id="form-cadastro" class="formularios">
                <input type="text" id="cadastro-nome" placeholder="Nome: ">
                <input type="text" id="cadastro-usuario" placeholder="Usuário: ">
                <input type="text" id="cadastro-senha" placeholder="Senha: ">
                <input type="text" id="cadastro-senha2" placeholder="Confirmar senha: ">
                <button type="submit">Cadastrar</button>
            </form>

            <button id="abrir-cadastro">Criar conta</button>
            <button id="voltar-login">Voltar para o login</button>

        </div>

    </main>
    <footer class="componente-rodape-geral">SIGA @LIVREPARASERNERD NO INSTAGRAM!</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/login.js"></script>
    <script src="js/temas.js"></script>
</body>
</html>
