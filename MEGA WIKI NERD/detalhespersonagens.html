<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVREPARASERNERD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div class="componente-banner-topo">
            <h1>MEGA WIKI NERD</h1>
        </div>
        <div class="componente-faixa-paleta">
            <div class="cor-1"></div>
            <div class="cor-2"></div>
            <div class="cor-3"></div>
        </div>
        <nav>
            <div class="componente-mapa-wiki">
                <ul>
                    <button id="btn-voltar-obra">VOLTAR</button>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="perfil.html">Meu Perfil</a></li>
                    <li><a href="avaliacoes.html">Avaliações</a></li>
                    <li><a href="personagens.html">Personagens </a></li>
                    <li><a href="login.html" id="btn-usuario">Login</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="main-info-perso">
        <div class="componente-dados-perso-iniciais">
            <div class="info-perso-lateral">
                <div class="componente-faixa-rosa"></div>
                <img id="imagem" src="" alt="">
                <div class="caixa-perso-infos">
                    <div class="faixa-rosa">IDADE:</div>
                    <p id="idade"></p>
                    <div class="faixa-rosa">ESPÉCIE:</div>
                    <p id="especie"></p>
                    <div class="faixa-rosa">STATUS:</div>
                    <p id="status"></p>
                    <div class="faixa-rosa">GÊNERO:</div>
                    <p id="genero"></p>
                    <div class="faixa-rosa">OCUPAÇÕES:</div>
                    <p id="ocupacoes"></p>
                </div>

            </div>
            <div class="info-perso-blocos">
                <div class="info-perso-principais">
                    <h2 id="nome"></h2> 
                    <p id="descricao"></p>
                    <div class="faixa-rosa">APARIÇÕES:</div>
                    <p id="1ap"></p>
                    <p id="aparicoes"></p>
                </div>
                <div class="caixa-galeria">
                    <h2 class="faixa-rosa">GALERIA:</h2>
                    <div class="galeria" id="galeria"></div>
                    <div id="gradiente"></div>
                    <button id="btn-galeria">
                        Ver mais ▼
                    </button>
                </div>
            </div>
        </div>

        <div class="componente-dados-perso-adicionais">
            <h2 class="faixa-rosa">PODERES E HABILIDADES:</h2>
            <p id="habilidades"></p>
        </div>
        <div class="componente-dados-perso-adicionais">
            <h2 class="faixa-rosa">RELACÕES:</h2>
            <div id="relacoes" class="row"></div>
        </div>
        <div class="componente-dados-perso-adicionais">
            <h2 class="faixa-rosa">CURIOSIDADES:</h2>
            <ul id="curiosidades"></ul>
        </div>

    </main>

    <footer class="componente-rodape-geral">SIGA @LIVREPARASERNERD NO INSTAGRAM!</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/detalhespersonagens.js"></script>
    <script src="js/temas.js"></script>
</body>
</html>
